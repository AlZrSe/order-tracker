[project]
name = "incident-response"
version = "0.1.0"
description = "Incident response service for receiving Grafana alerts and triggering automated analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "python-json-logger>=2.0,<3",
  "opentelemetry-api>=1.21,<2",
  "opentelemetry-sdk>=1.21,<2",
  "opentelemetry-instrumentation-fastapi>=0.42b0,<1",
  "opentelemetry-exporter-otlp>=1.21,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<1",
]