apiVersion: 1

groups:
  - name: order-tracker-alerts
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx-alert
        title: High 5xx Error Rate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus-datasource
            model:
              expr: |
                sum(increase(order_tracker_order_lookup_requests_total{job="order-tracker",status_code=~"5.."}[1m])) by (route)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        annotations:
          summary: "High 5xx Error Rate"
          __dashboardUid__: "order-tracker-requests"
          __panelId__: "2"
          description: |
            5xx error rate is {{ $values.A.Value | printf "%.2%" }} on endpoint {{ $labels.route }}
            
            - **Endpoint**: {{ $labels.route }}
            - **Time window**: 1 minute
            - **Dashboard**: http://127.0.0.1:3000/d/order-tracker-requests/order-tracker-request-metrics
            - **Alert**: {{ $values.A.Value | printf "%.2%" }} 5xx rate
        labels:
          severity: critical
          service: order-tracker
        for: 30s
        noDataState: NoData
        execErrState: Error