[project]
name = "order-tracker"
version = "0.1.0"
description = "A small order tracking service for an observability and incident response exercise"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "opentelemetry-api>=1.21,<2",
  "opentelemetry-sdk>=1.21,<2",
  "opentelemetry-instrumentation-fastapi>=0.42b0,<1",
  "opentelemetry-exporter-otlp>=1.21,<2",
  "opentelemetry-instrumentation-sqlite3>=0.42b0,<1",
  "prometheus-fastapi-instrumentator>=6.0,<7",
  "opentelemetry-exporter-prometheus==1.12.0rc1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
